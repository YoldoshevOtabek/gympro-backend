services:
  - type: web
    name: gympro-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://your-frontend.example.com,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: gympro-db
          property: connectionString
      - key: SEED_DATABASE
        value: "true"

databases:
  - name: gympro-db
    plan: free